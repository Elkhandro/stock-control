{% extends "base.html" %}

{% block title %}Ошибка 404{% endblock %}

{% block content %}
<div class="text-center py-5">
    <h1 class="display-1 text-muted">404</h1>
    <h2 class="mb-3">Страница не найдена</h2>
    <p class="lead text-muted">{{ message|default:"Запрашиваемый ресурс не существует." }}</p>
    <a href="{% url 'homepage:index' %}" class="btn btn-primary mt-3">
        Вернуться на главную
    </a>
</div>
{% endblock %}
